asyncapi: 3.0.0
info:
  title: OULA Event Backbone
  version: 0.6.0
channels:
  matchingCompleted:
    address: matching.match.completed.v1
    messages:
      completed:
        payload: {type: object}
  transactionStageChanged:
    address: transaction.stage.changed.v1
    messages:
      changed:
        payload: {type: object}
  intelligenceEvidenceRecorded:
    address: intelligence.evidence.recorded.v1
    messages:
      recorded:
        payload: {type: object}
  intelligenceAssumptionRegistered:
    address: intelligence.assumption.registered.v1
    messages:
      registered:
        payload: {type: object}
  intelligenceRecommendationGenerated:
    address: intelligence.recommendation.generated.v1
    messages:
      generated:
        payload: {type: object}
  intelligenceDecisionRecorded:
    address: intelligence.decision.recorded.v1
    messages:
      recorded:
        payload: {type: object}
  intelligenceOutcomeObserved:
    address: intelligence.outcome.observed.v1
    messages:
      observed:
        payload: {type: object}
  intelligenceRealityGapDetected:
    address: intelligence.reality_gap.detected.v1
    messages:
      detected:
        payload: {type: object}
