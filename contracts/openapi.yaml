        recordedAt: {type: string, format: date-time}
    UnitOccupancyView:
      type: object
      required: [unitId, propertyId, unitCode, occupancyStatus]
      properties:
        unitId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        unitCode: {type: string}
        occupancyStatus: {type: string, enum: [UNKNOWN, OCCUPIED_RECORDED, VACANCY_RECORDED]}
        leaseId: {type: [string, 'null'], format: uuid}
        lastCheckedInAt: {type: [string, 'null'], format: date-time}
        lastCheckedOutAt: {type: [string, 'null'], format: date-time}
    RentalLifecycleAdvisory:
      type: object
      required: [workspaceId, propertyId, rulesVersion, generatedAt, asOfDate,
        assessmentState, totalUnits, knownOccupancyUnits, unknownOccupancyUnits,
        activeLeasesReviewed, limitations, recommendations]
      properties:
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        rulesVersion: {type: string}
        generatedAt: {type: string, format: date-time}
        asOfDate: {type: string, format: date}
        assessmentState:
          type: string
          enum: [NO_UNITS, INSUFFICIENT_OCCUPANCY_EVIDENCE,
                 PARTIAL_OCCUPANCY_EVIDENCE, EVIDENCE_RECORDED]
        totalUnits: {type: integer, minimum: 0}
        knownOccupancyUnits: {type: integer, minimum: 0}
        unknownOccupancyUnits: {type: integer, minimum: 0}
        activeLeasesReviewed: {type: integer, minimum: 0}
        limitations:
          type: array
          items: {type: string}
        recommendations:
          type: array
          items: {$ref: '#/components/schemas/AdvisoryItem'}
    OperationalAdvisory:
      type: object
      required: [workspaceId, propertyId, sourceSnapshotId, snapshotPolicyKey, snapshotPolicyVersion, advisoryRulesVersion, assessmentState, observedTrend, sourceAssessedAt, generatedAt, limitations, recommendations]
      properties:
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        sourceSnapshotId: {type: string, format: uuid}
        snapshotPolicyKey: {type: string}
        snapshotPolicyVersion: {type: string}
        advisoryRulesVersion: {type: string}
        assessmentState: {type: string, enum: [ASSESSABLE, LIMITED_EVIDENCE, STALE]}
        observedTrend: {type: string}
        sourceAssessedAt: {type: string, format: date-time}
        generatedAt: {type: string, format: date-time}
        limitations: {type: array, items: {type: string}}
        recommendations:
          type: array
          items: {$ref: '#/components/schemas/AdvisoryItem'}
    AdvisoryItem:
      type: object
      required: [dimension, observedStatus, trendDirection, priority, actionCode, explanation, executionGate, observedEvidence]
      properties:
        dimension: {type: string}
        observedStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        trendDirection: {type: string}
        priority: {type: string, enum: [HIGH, MEDIUM, DATA_QUALITY]}
        actionCode: {type: string}
        explanation: {type: string}
        executionGate: {type: string, enum: [HUMAN_REVIEW_REQUIRED]}
        observedEvidence:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string}
              value: {type: string}
    RentReceiptEvidenceRequest:
      type: object
      required: [amount, evidenceId, note]
      properties:
        amount: {type: number, exclusiveMinimum: 0}
        evidenceId: {type: string, format: uuid}
        externalReference: {type: [string, 'null'], maxLength: 255}
        note: {type: string, minLength: 1, maxLength: 1000}
    RentReceiptReversalRequest:
      type: object
      required: [reversalEvidenceId, rationale]
      properties:
        reversalEvidenceId: {type: string, format: uuid}
        rationale: {type: string, minLength: 1, maxLength: 1000}
    RentEvidenceEntry:
      type: object
      required: [id, workspaceId, leaseId, installmentId, entryType, amount, currency, evidenceId, note, recordedBy, recordedAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        leaseId: {type: string, format: uuid}
        installmentId: {type: string, format: uuid}
        entryType: {type: string, enum: [RECEIPT, REVERSAL]}
        amount: {type: number}
        currency: {type: string}
        evidenceId: {type: string, format: uuid}
        externalReference: {type: [string, 'null']}
        reversesEntryId: {type: [string, 'null'], format: uuid}
        note: {type: string}
        recordedBy: {type: string, format: uuid}
        recordedAt: {type: string, format: date-time}
    RentalFinancialSummary:
      type: object
      required: [leaseId, asOfDate, currency, totalContractualDue, netDocumentaryReceipts, uncoveredDueThroughDate, overdueInstallments, installments]
      properties:
        leaseId: {type: string, format: uuid}
        asOfDate: {type: string, format: date}
        currency: {type: string}
        totalContractualDue: {type: number}
        netDocumentaryReceipts: {type: number}
        uncoveredDueThroughDate: {type: number}
        overdueInstallments: {type: integer}
        installments:
          type: array
          items: {$ref: '#/components/schemas/RentEvidencePosition'}
    RentEvidencePosition:
      type: object
      required: [installmentId, leaseId, dueOn, currency, contractualDue, documentaryNetReceived, documentaryGap, evidenceStatus]
      properties:
        installmentId: {type: string, format: uuid}
        leaseId: {type: string, format: uuid}
        dueOn: {type: string, format: date}
        currency: {type: string}
        contractualDue: {type: number}
        documentaryNetReceived: {type: number}
        documentaryGap: {type: number}
        evidenceStatus: {type: string, enum: [DOCUMENTARY_COVERED, OVERDUE_DOCUMENTARY_GAP, PARTIALLY_EVIDENCED, NOT_YET_DUE_OR_DUE_TODAY]}
    PropertyOccupancyInsight:
      type: object
      required: [propertyId, asOf, totalUnits, knownUnits, occupiedRecordedUnits, vacancyRecordedUnits, unknownUnits, coverageStatus]
      properties:
        propertyId: {type: string, format: uuid}
        asOf: {type: string, format: date-time}
        totalUnits: {type: integer}
        knownUnits: {type: integer}
        occupiedRecordedUnits: {type: integer}
        vacancyRecordedUnits: {type: integer}
        unknownUnits: {type: integer}
        evidenceCoverageRatio: {type: [number, 'null']}
        occupiedShareOfKnown: {type: [number, 'null']}
        coverageStatus: {type: string, enum: [NO_UNITS, NO_EVIDENCE, PARTIAL_EVIDENCE, COMPLETE_EVIDENCE]}
    HumanReviewCaptureRequest:
      type: object
      required: [recommendationIndex, expectedRulesVersion, expectedActionCode, expectedUnitId]
      properties:
        recommendationIndex: {type: integer, minimum: 0}
        expectedRulesVersion: {type: string}
        expectedActionCode: {type: string}
        expectedUnitId: {type: string, format: uuid}
        expectedLeaseId: {type: [string, 'null'], format: uuid}
    HumanReviewDecisionRequest:
      type: object
      required: [decision, rationale]
      properties:
        decision: {type: string, enum: [ACCEPT_FOR_REVIEW, DECLINE, DEFER]}
        rationale: {type: string, minLength: 1, maxLength: 2000}
    HumanReviewOutcomeRequest:
      type: object
      required: [observedOutcome, rationale, evidenceId]
      properties:
        observedOutcome:
          type: string
          enum: [IMPROVEMENT_OBSERVED, NO_CHANGE_OBSERVED,
                 DETERIORATION_OBSERVED, INCONCLUSIVE]
        rationale: {type: string, minLength: 1, maxLength: 2000}
        evidenceId: {type: string, format: uuid}
    HumanReviewCase:
      type: object
      required: [id, workspaceId, propertyId, unitId, rulesVersion,
                 dimension, actionCode, initialPriority, sourceGeneratedAt,
                 sourceMetricsJson, sourceFingerprint, capturedBy, capturedAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        unitId: {type: string, format: uuid}
        leaseId: {type: [string, 'null'], format: uuid}
        rulesVersion: {type: string}
        dimension: {type: string}
        actionCode: {type: string}
        initialPriority: {type: string}
        sourceGeneratedAt: {type: string, format: date-time}
        sourceMetricsJson: {type: string, description: Immutable JSON source metrics}
        sourceFingerprint: {type: string}
        capturedBy: {type: string, format: uuid}
        capturedAt: {type: string, format: date-time}
    HumanReviewEvent:
      type: object
      required: [id, workspaceId, reviewCaseId, sequenceNo,
                 eventType, valueCode, rationale, actorId, recordedAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        reviewCaseId: {type: string, format: uuid}
        sequenceNo: {type: integer, minimum: 1}
        eventType: {type: string, enum: [DECISION, OUTCOME_OBSERVATION]}
        valueCode: {type: string}
        rationale: {type: string}
        evidenceId: {type: [string, 'null'], format: uuid}
        actorId: {type: string, format: uuid}
        recordedAt: {type: string, format: date-time}
    HumanReviewTimeline:
      type: object
      required: [reviewCase, history]
      properties:
        reviewCase: {$ref: '#/components/schemas/HumanReviewCase'}
        history:
          type: array
          items: {$ref: '#/components/schemas/HumanReviewEvent'}
    HumanFeedbackSummary:
      type: object
      required: [propertyId, capturedCases, casesWithHumanDecision,
                 casesWithOutcomeObservation, casesWithImprovementObservation,
                 casesWithInconclusiveObservation, evidenceInterpretation]
      properties:
        propertyId: {type: string, format: uuid}
        capturedCases: {type: integer, minimum: 0}
        casesWithHumanDecision: {type: integer, minimum: 0}
        casesWithOutcomeObservation: {type: integer, minimum: 0}
        casesWithImprovementObservation: {type: integer, minimum: 0}
        casesWithInconclusiveObservation: {type: integer, minimum: 0}
        evidenceInterpretation: {type: string}
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    BadRequest:
      description: Request validation or domain precondition failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Bearer token is missing or invalid.
    Forbidden:
      description: Workspace, purpose, or scope authorization failed.
    NotFound:
      description: Resource does not exist in the authorized context.
    Conflict:
      description: State, concurrency, or idempotency conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
