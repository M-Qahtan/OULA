        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/properties/{propertyId}/intervention-reviews:
    post:
      summary: Record a human review of a current source-bound operational recommendation
      description: >
        Human review is not expenditure approval, an execution instruction,
        government action or evidence of realized property outcomes.
      operationId: recordInterventionReview
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceSnapshotId, dimension, actionCode, decision, rationale]
              properties:
                sourceSnapshotId: {type: string, format: uuid}
                dimension: {type: string, maxLength: 40}
                actionCode: {type: string, maxLength: 100}
                decision: {type: string, enum: [ACKNOWLEDGED, DECLINED, DEFERRED]}
                rationale: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: Immutable, human-attested advisory review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterventionReview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      summary: Read review and observed outcome history of one managed property
      operationId: getInterventionHistory
      parameters:
        - in: path
