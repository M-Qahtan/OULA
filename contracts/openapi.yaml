  /v1/properties/{propertyId}/vitals/trend:
    get:
      summary: Compare the two most recent immutable Property Vital Sign snapshots
      description: >
        Read-only observational comparison. UNKNOWN is not comparable. Different
        vital policy versions are not compared. No autonomous execution or
        causal inference is performed.
      operationId: propertyVitalTrend
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          required: false
          description: Bounded history lookup; the two newest snapshots are compared.
          schema: {type: integer, minimum: 1, maximum: 100, default: 2}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Evidence-aware comparison or explicit non-comparability
          content:
            application/json:
              schema:
                type: object
                required: [propertyId, direction, dimensions]
                properties:
                  propertyId: {type: string, format: uuid}
                  direction:
                    type: string
                    enum: [NO_HISTORY, INSUFFICIENT_HISTORY, POLICY_NOT_COMPARABLE, NOT_COMPARABLE, UNCHANGED, IMPROVED, WORSENED, MIXED]
                  currentSnapshotId: {type: [string, 'null'], format: uuid}
                  previousSnapshotId: {type: [string, 'null'], format: uuid}
                  dimensions:
                    type: array
                    items:
                      type: object
                      required: [dimension, previous, current, direction]
                      properties:
                        dimension: {type: string}
                        previous: {type: string, enum: [UNKNOWN, GREEN, AMBER, RED]}
                        current: {type: string, enum: [UNKNOWN, GREEN, AMBER, RED]}
                        direction: {type: string, enum: [NOT_COMPARABLE, UNCHANGED, IMPROVED, WORSENED]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
