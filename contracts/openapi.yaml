              properties:
                afterSnapshotId: {type: string, format: uuid}
                completedWorkOrderId: {type: string, format: uuid}
                observationNote: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: Observed before/after status, with explicit evidence level
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterventionOutcome'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
