components:
  securitySchemes:
    oulaBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IntentId:
      in: path
      name: intentId
      required: true
      schema: {type: string, format: uuid}
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema: {type: string, format: uuid}
    WorkspaceId:
      in: header
      name: X-OULA-Workspace-ID
      required: true
      description: Requested workspace; must also be authorized by the JWT.
      schema: {type: string, format: uuid}
    Purpose:
      in: header
      name: X-OULA-Purpose
      required: true
      description: Purpose limitation; must match both operation policy and JWT claims.
      schema:
        type: string
        enum: [PROPERTY_DECISION_SUPPORT, TRANSACTION_EXECUTION, PROPERTY_MANAGEMENT, AUTONOMOUS_EXECUTION, INTEGRATION_OPERATIONS]
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    Jurisdiction:
      in: header
      name: X-OULA-Jurisdiction
      required: false
      description: Explicit policy jurisdiction. Omission is represented as UNSPECIFIED; OULA does not infer jurisdiction.
      schema: {type: string, minLength: 1, maxLength: 80, default: UNSPECIFIED}
    ApprovalId:
      in: header
      name: X-OULA-Approval-ID
      required: false
      description: Context-bound approved compliance request used only when the active policy requires approval.
      schema: {type: string, format: uuid}
  schemas:
    ConsentDecisionRequest:
      type: object
      required: [consentCode, decision]
      properties:
        consentCode:
          type: string
          enum: [LIFE_CONTEXT_PROCESSING, PERSONALIZATION_MEMORY, LOCATION_CONTEXT, FINANCIAL_CONTEXT]
        decision:
          type: string
          enum: [GRANTED, REVOKED]
        reason: {type: [string, 'null'], maxLength: 500}
    ConsentResponse:
      type: object
      required: [consentCode, decision, source, occurredAt]
      properties:
        consentCode:
          type: string
          enum: [LIFE_CONTEXT_PROCESSING, PERSONALIZATION_MEMORY, LOCATION_CONTEXT, FINANCIAL_CONTEXT]
        decision:
          type: string
          enum: [GRANTED, REVOKED]
        reason: {type: [string, 'null']}
        source: {type: string, enum: [USER_EXPLICIT]}
        occurredAt: {type: string, format: date-time}
    PropertyCreateRequest:
      type: object
      additionalProperties: false
      required: [assetType, district, bedrooms, askingPrice]
      properties:
        assetType: {type: string, enum: [RESIDENTIAL, COMMERCIAL]}
        district: {type: string, minLength: 1, maxLength: 160}
        bedrooms: {type: integer, minimum: 0, maximum: 100}
        askingPrice: {type: number, exclusiveMinimum: 0}
        demo: {type: boolean, default: false}
    ListingCreateRequest:
      type: object
      additionalProperties: false
      required: [transactionType, askingPrice]
      properties:
        transactionType: {type: string, enum: [SALE, RENT]}
        askingPrice: {type: number, exclusiveMinimum: 0}
    PropertyIntakeResponse:
      type: object
      required: [id, workspaceId, assetType, district, bedrooms, askingPrice, dataOrigin, sourceType, truthStatus]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        assetType: {type: string}
        district: {type: string}
        bedrooms: {type: integer}
        askingPrice: {type: number}
        dataOrigin: {type: string}
        sourceType: {type: string}
        truthStatus: {type: string}
    ListingIntakeResponse:
      type: object
      required: [id, workspaceId, propertyId, transactionType, status, askingPrice, currency, dataOrigin, sourceType, truthStatus]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        transactionType: {type: string}
        status: {type: string}
        askingPrice: {type: number}
        currency: {type: string}
        dataOrigin: {type: string}
        sourceType: {type: string}
        truthStatus: {type: string}
    IntentCreateRequest:
      type: object
      additionalProperties: false
      required: [intentType, budgetMax, minimumBedrooms, preferredDistricts]
      properties:
        intentType: {type: string, enum: [BUY, RENT]}
        budgetMax: {type: number, exclusiveMinimum: 0}
        minimumBedrooms: {type: integer, minimum: 0}
        preferredDistricts:
          type: array
          uniqueItems: true
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 100}
    IntentResponse:
      type: object
      required: [id, workspaceId, intentType, status, budgetMax, minimumBedrooms, preferredDistricts]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        intentType: {type: string, enum: [BUY, RENT]}
        status: {type: string, enum: [DRAFT, ACTIVE, PAUSED, FULFILLED, CANCELLED]}
        budgetMax: {type: number, exclusiveMinimum: 0}
        minimumBedrooms: {type: integer, minimum: 0}
        preferredDistricts:
          type: array
          uniqueItems: true
          items: {type: string}
    PropertyPassport:
      type: object
      description: >-
        Truth-aware property projection returned by the Java PropertyPassport
        record. A listing is not an independently verified property. The
        verifiedFactCoverage value is the fraction of facts whose truthStatus
        is VERIFIED, not a predictive confidence score or proof of title.
      required: [propertyId, workspaceId, facts, verifiedFactCoverage, generatedAt]
      properties:
        propertyId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        assetType: {type: [string, 'null']}
        district: {type: [string, 'null']}
        bedrooms: {type: [integer, 'null']}
        askingPrice:
          type: [number, 'null']
          description: Stated asking price from the workspace-scoped property record; currency is not asserted by this representation.
        facts:
          type: array
          items: {$ref: '#/components/schemas/PropertyPassportFact'}
        latestState:
          description: Latest recorded property state, or null if none is recorded.
          oneOf:
            - {$ref: '#/components/schemas/PropertyStateSnapshot'}
            - {type: 'null'}
        verifiedFactCoverage:
          type: number
          minimum: 0
          maximum: 1
        generatedAt: {type: string, format: date-time}
    PropertyPassportFact:
      type: object
      description: >-
        Source-linked fact returned by Java PropertyPassportFact. valueJson
        is a STRING containing JSON text, not a parsed object. VERIFIED is
        meaningful only for evidence independently verified in the
        originating workspace.
      required: [id, key, valueJson, truthStatus, sourceType]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        valueJson: {type: string}
        truthStatus: {type: string}
        sourceType: {type: string}
        confidence: {type: [number, 'null']}
        validFrom: {type: [string, 'null'], format: date-time}
        validTo: {type: [string, 'null'], format: date-time}
    InterventionReview:
      type: object
      description: Immutable human review, not execution or financial authority.
      required: [id, workspaceId, propertyId, sourceSnapshotId, dimension, actionCode, baselineStatus, decision, rationale, reviewedBy, reviewedAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        sourceSnapshotId: {type: string, format: uuid}
        sourcePolicyKey: {type: string}
        sourcePolicyVersion: {type: string}
        advisoryRulesVersion: {type: string}
        dimension: {type: string}
        actionCode: {type: string}
        baselineStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        decision: {type: string, enum: [ACKNOWLEDGED, DECLINED, DEFERRED]}
        rationale: {type: string}
        reviewedBy: {type: string, format: uuid}
        reviewedAt: {type: string, format: date-time}
    InterventionOutcome:
      type: object
      description: Descriptive observational after-state, with no causal attribution.
      required: [id, workspaceId, propertyId, reviewId, afterSnapshotId, beforeStatus, afterStatus, observedDirection, executionEvidenceLevel, note, observedBy, observedAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        reviewId: {type: string, format: uuid}
        afterSnapshotId: {type: string, format: uuid}
        workOrderId: {type: [string, 'null'], format: uuid}
        beforeStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        afterStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        observedDirection: {type: string, enum: [IMPROVED, WORSENED, UNCHANGED, NOT_COMPARABLE]}
        executionEvidenceLevel: {type: string, enum: [OBSERVATION_ONLY, VERIFIED_WORK_ORDER]}
        note: {type: string}
        observedBy: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
    InterventionHistory:
      type: object
      required: [propertyId, reviews, outcomes]
      properties:
        propertyId: {type: string, format: uuid}
        reviews: {type: array, items: {$ref: '#/components/schemas/InterventionReview'}}
        outcomes: {type: array, items: {$ref: '#/components/schemas/InterventionOutcome'}}
    MatchRunResponse:
      type: object
      required: [matchRunId, matches]
      properties:
        matchRunId: {type: string, format: uuid}
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchItem'
    MatchItem:
      type: object
      required: [propertyId, rank, score, confidence, dimensions]
      properties:
        propertyId: {type: string, format: uuid}
        rank: {type: integer, minimum: 1}
        score: {type: number, minimum: 0, maximum: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        dimensions:
          type: object
          additionalProperties: {type: number}
    TransactionCreateRequest:
      type: object
      required: [intentId, propertyId]
      properties:
        intentId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
    TransactionViewingRequest:
      type: object
      required: [expectedVersion, humanConfirmed]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        preferredAt: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null'], maxLength: 500}
        humanConfirmed: {type: boolean, const: true}
    TransactionOfferRequest:
      type: object
      required: [expectedVersion, amount, currency, humanConfirmed]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        amount: {type: number, exclusiveMinimum: 0}
        currency: {type: string, pattern: '^[A-Za-z]{3}      properties:
        expectedVersion: {type: integer, minimum: 0}
        target:
          type: string
          enum: [DRAFT, QUALIFIED, VIEWING, OFFERING, NEGOTIATING, DUE_DILIGENCE, CONTRACTING, CLOSING, HANDOVER, COMPLETED, CANCELLED]
        reason: {type: string, minLength: 1, maxLength: 500}
    TransactionResponse:
      type: object
      required: [id, workspaceId, stage, version]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        stage: {type: string}
        version: {type: integer, minimum: 0}
    IntelligenceIdResponse:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    EvidenceRequest:
      type: object
      required: [evidenceType, sourceType, contentHash, verificationStatus]
      properties:
        evidenceType:
          type: string
          enum: [DOCUMENT, PHOTO, VIDEO, SENSOR_READING, GOVERNMENT_RECORD, SIGNED_ASSERTION, CALCULATION, INSPECTION, TRANSACTION_RECORD, USER_REPORTED_OUTCOME]
        sourceType: {type: string, maxLength: 80}
        sourceIdentity: {type: string, maxLength: 255}
        contentReference: {type: string}
        contentHash: {type: string, minLength: 1, maxLength: 128}
        verificationStatus:
          type: string
          enum: [UNVERIFIED, VERIFIED, REJECTED, EXPIRED]
        capturedAt: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
        jurisdiction: {type: string, maxLength: 80}
    AssumptionRequest:
      type: object
      required: [statement, value, source, reason, confidence, sensitivity]
      properties:
        statement: {type: string, minLength: 1}
        value: {type: object, additionalProperties: true}
        source: {type: string, minLength: 1, maxLength: 255}
        reason: {type: string, minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        sensitivity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        validUntil: {type: string, format: date-time}
    RecommendationRequest:
      type: object
      required: [matchRunId, evidenceIds, validHours]
      properties:
        matchRunId: {type: string, format: uuid}
        evidenceIds:
          type: array
          maxItems: 25
          items: {type: string, format: uuid}
        assumptionIds:
          type: array
          maxItems: 25
          items: {type: string, format: uuid}
        validHours: {type: integer, minimum: 1, maximum: 720}
    RecommendationView:
      type: object
      required: [recommendationId, matchRunId, recommendedPropertyId, lifeFitScore, confidence, modelId, modelVersion, evidenceIds, assumptionIds]
      properties:
        recommendationId: {type: string, format: uuid}
        matchRunId: {type: string, format: uuid}
        recommendedPropertyId: {type: string, format: uuid}
        lifeFitScore: {type: number, minimum: 0, maximum: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        modelId: {type: string}
        modelVersion: {type: string}
        evidenceIds: {type: array, items: {type: string, format: uuid}}
        assumptionIds: {type: array, items: {type: string, format: uuid}}
    RecommendationExplanation:
      type: object
      required: [recommendationId, executiveSummary, recommendedPropertyId, lifeFitScore, confidence, confidenceBreakdown, uncertainty, modelId, modelVersion, modelType, riskClass, evidenceIds, assumptionIds, alternatives]
      properties:
        recommendationId: {type: string, format: uuid}
        executiveSummary: {type: string}
        recommendedPropertyId: {type: string, format: uuid}
        lifeFitScore: {type: number}
        confidence: {type: number}
