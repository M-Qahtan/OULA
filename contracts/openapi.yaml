openapi: 3.1.0
info:
  title: OULA Riyadh MVP API
  version: 1.12.0
  description: Secure Golden Path API for OULA.
security:
  - oulaBearer: []
paths:
  /v1/properties:
    post:
      operationId: createProperty
      description: Private workspace-only declared intake; requires authorized PROPERTY_MANAGEMENT or PROPERTY_DECISION_SUPPORT and oula.property.write; no public publication or independent verification.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PropertyCreateRequest'}
      responses:
        '201':
          description: Private, unverified record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyIntakeResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}:
    get:
      operationId: getProperty
      description: Private workspace-only declared intake; requires authorized PROPERTY_MANAGEMENT or PROPERTY_DECISION_SUPPORT and oula.property.read; no public publication or independent verification.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Private, unverified record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyIntakeResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}/listings:
    post:
      operationId: createDraftListing
      description: Private workspace-only declared intake; requires authorized PROPERTY_MANAGEMENT or PROPERTY_DECISION_SUPPORT and oula.listing.write; no public publication or independent verification.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingCreateRequest'}
      responses:
        '201':
          description: Private, unverified record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingIntakeResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/listings:
    get:
      operationId: searchListings
      description: Private workspace-only declared intake; requires authorized PROPERTY_MANAGEMENT or PROPERTY_DECISION_SUPPORT and oula.listing.read; no public publication or independent verification.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - in: query
          name: district
          required: false
          schema: {type: string, maxLength: 160}
      responses:
        '200':
          description: Private, unverified record
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ListingIntakeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/listings/{listingId}:
    get:
      operationId: getListing
      description: Private workspace-only declared intake; requires authorized PROPERTY_MANAGEMENT or PROPERTY_DECISION_SUPPORT and oula.listing.read; no public publication or independent verification.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - in: path
          name: listingId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Private, unverified record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingIntakeResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/experience/manifest:
    get:
      summary: Return authenticated workspace and purpose-scoped UX capabilities
      description: >
        Read-only capability discovery; this endpoint never authorizes an action
        or grants roles. All subsequent commands require their own JWT/scope validation.
        NEXUS can project DEAL_ROOM_READ with oula.transaction.read; discovering it
        does not reveal any deal or permit transaction mutation.
        In PROPERTY_MANAGEMENT, private property intake and draft-listing capabilities
        are projected only for their specific OAuth scopes. These are private DECLARED
        records, not verified ownership or published real estate listings.
      operationId: getExperienceManifest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Authenticated allowed actions, filtered by existing JWT scopes
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [workspaceId, purpose, lens, capabilities, source]
                properties:
                  workspaceId: {type: string, format: uuid}
                  purpose: {type: string, enum: [PROPERTY_DECISION_SUPPORT, PROPERTY_MANAGEMENT, TRANSACTION_EXECUTION]}
                  lens: {type: string, enum: [PULSE, HABITAT, NEXUS]}
                  source: {type: string, const: AUTHENTICATED_SCOPE_PROJECTION}
                  capabilities:
                    type: array
                    items:
                      type: object
                      required: [code, route, scope, mode]
                      properties:
                        code: {type: string}
                        route: {type: string}
                        scope: {type: string}
                        mode: {type: string, enum: [QUERY, COMMAND]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/consents:
    get:
      summary: Read the authenticated actor's current consent decisions for the requested workspace and purpose
      description: >
        Consent is independent from role and OAuth scope. The result contains
        only the current actor's latest explicit decisions in the requested
        workspace/purpose context.
      operationId: listConsents
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Current purpose-bound consent decisions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ConsentResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/consents/decisions:
    post:
      summary: Append an explicit consent grant or revocation for the authenticated actor
      description: >
        Requires a purpose authorized by the JWT plus oula.consent.write.
        The decision is append-only, idempotent, auditable and does not grant
        any OAuth scope or workspace membership by itself.
      operationId: decideConsent
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentDecisionRequest'}
      responses:
        '201':
          description: Consent decision appended
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intents:
    post:
      summary: Create an explicit active housing intent within an authorized workspace
      description: Requires PROPERTY_DECISION_SUPPORT and oula.intent.write scope; not a verified person profile.
      operationId: createIntent
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntentCreateRequest'}
      responses:
        '201':
          description: Newly created or idempotently replayed intent
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intents/{intentId}:
    get:
      summary: Read an authorized workspace-scoped intent
      description: Requires PROPERTY_DECISION_SUPPORT and oula.intent.read scope.
      operationId: getIntent
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Persisted workspace-scoped intent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntentResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/intents/{intentId}/matches:
    post:
      summary: Create and execute a match run for an active intent
      operationId: runMatching
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: MatchRun created
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRunResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/transactions:
    post:
      summary: Start a workspace-scoped transaction in DRAFT
      description: >
        Creates one open transaction for an authorized workspace-scoped intent
        and property. This is an OULA transaction record only; it is not a
        government registration, bank approval, escrow instruction or legal transfer.
      operationId: createTransaction
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransactionCreateRequest'}
      responses:
        '201':
          description: Transaction created in DRAFT
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/transactions/{transactionId}:
    get:
      summary: Get transaction state
      operationId: getTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Transaction state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/transactions/{transactionId}/deal-room:
    get:
      summary: Read the capability-aware Deal Room overview
      description: >
        Returns persisted transaction, viewing and offer records plus commands
        available only to callers with both the required JWT scope and a specific
        active, accepted, unexpired actor-level deal grant. No workspace-wide
        deal visibility, signing, payment, escrow, mortgage or title authority.
      operationId: getDealRoom
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Deal Room overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRoomResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/transactions/{transactionId}/viewings:
    post:
      summary: Request a human-confirmed property viewing
      description: >
        Requires an existing QUALIFIED transaction and advances it to VIEWING
        through the canonical transaction state machine. The command is not a
        confirmed appointment with an external party unless separately arranged.
      operationId: requestTransactionViewing
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransactionViewingRequest'}
      responses:
        '201':
          description: Viewing request persisted and transaction advanced to VIEWING
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionViewingCommandResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/transactions/{transactionId}/offers:
    post:
      summary: Submit a human-confirmed offer
      description: >
        Requires an existing VIEWING transaction with a persisted viewing request
        and advances it to OFFERING through the canonical transaction state machine.
        It records an OULA offer only; it does not execute payment, signing, transfer
        or external acceptance.
      operationId: submitTransactionOffer
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransactionOfferRequest'}
      responses:
        '201':
          description: Offer persisted and transaction advanced to OFFERING
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionOfferCommandResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/transactions/{transactionId}/transitions:
    post:
      summary: Advance a transaction through a legal state transition
      description: >
        Generic governed transition command. VIEWING and OFFERING are rejected here
        and must use the dedicated human-confirmed viewing and offer endpoints.
      operationId: advanceTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionTransitionRequest'
      responses:
        '200':
          description: Transaction advanced
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/offices/members:
    get:
      summary: List the first 100 active institutional members for an office ADMIN
      description: >
        Requires JWT workspace, TRANSACTION_EXECUTION purpose, exact
        oula.office.members.manage scope AND database-bound institutional ADMIN.
        Returns only actor IDs, role and ACTIVE status; no deal access or IdP
        subjects are disclosed. The result is bounded to 100 records.
      operationId: listOfficeMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Active office members (bounded to the first 100)
          content:
            application/json:
              schema: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/OfficeMembershipView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/offices/members/invitations:
    get:
      summary: List the first 100 active pending office invitations for ADMIN
      description: >
        Requires signed, active issuer+subject-bound office ADMIN and
        oula.office.members.manage. Cancelled, expired and accepted invitations
        are not actionable and are excluded. The result grants no data access.
      operationId: listOfficePendingInvitations
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Actionable pending invitations only (bounded to first 100)
          content:
            application/json:
              schema: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/OfficeMemberInvitationView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: ADMIN invites BROKER or STAFF to an already trusted institutional office
      description: >
        Requires active issuer+subject-bound ADMIN membership AND
        oula.office.members.manage. An invite grants no data access, cannot
        create an ADMIN or revive an already revoked member, and expires
        within fourteen days. Delivery of invitation IDs is external.
      operationId: inviteOfficeMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfficeInviteRequest'}
      responses:
        '201':
          description: Institutional membership invitation created, not activated
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficeMemberInvitationView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/offices/members/invitations/mine:
    get:
      summary: Discover only my own pending office invitation by signed identity
      description: >
        Before joining, an invitee need not claim workspace membership.
        Requires signed JWT with actor_id, issuer, subject, TRANSACTION_EXECUTION
        purpose and oula.office.membership.accept scope. Returns only unexpired
        uncancelled invitations addressed to this exact identity and workspace.
        An empty array never means the caller is a verified member.
      operationId: listMyOfficeInvitations
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: My actionable pending invitations for this office
          content:
            application/json:
              schema: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/OfficeMemberInvitationView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/offices/members/invitations/{invitationId}/accept:
    post:
      summary: Recipient explicitly accepts their own time-limited office invitation
      description: >
        Needs a signed JWT with actor_id, issuer, subject, TRANSACTION_EXECUTION
        purpose and oula.office.membership.accept scope. Before enrollment,
        workspace-membership JWT claims are NOT required; immutable invitation
        target identity must match. Cannot elevate to ADMIN.
      operationId: acceptOfficeMemberInvitation
      parameters:
        - in: path
          name: invitationId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Institution membership activated for authenticated recipient
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficeMembershipView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/offices/members/invitations/{invitationId}/cancel:
    post:
      summary: Cancel an office invitation before the recipient accepts
      description: >
        Requires a signed token with oula.office.members.manage and an ACTIVE
        database-provisioned institutional ADMIN. Cancellation is a durable,
        auditable veto stored independently from the original invitation; it
        blocks recipient acceptance and idempotency replay even with a valid JWT.
        Cannot cancel an already accepted invitation. No membership role is created.
      operationId: cancelOfficeMemberInvitation
      parameters:
        - in: path
          name: invitationId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Pending invitation cancelled, without deleting evidence
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficeMemberInvitationView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/offices/members/{actorId}/revoke:
    post:
      summary: ADMIN revokes STAFF or BROKER and atomically invalidates deal viewer grants
      description: >
        Requires active institutional ADMIN and oula.office.members.manage.
        Cannot self-revoke or revoke another ADMIN. Revoked members cannot
        be reactivated through a new invitation.
      operationId: revokeOfficeMember
      parameters:
        - in: path
          name: actorId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Institution membership and viewer grants revoked
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficeMembershipView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/transactions/{transactionId}/read-grants:
    post:
      summary: Invite a specific actor to read a private deal
      description: >
        Originator-only invitation requires oula.transaction.grant.manage.
        The invitation remains unreadable until the invited JWT actor explicitly
        accepts it. A re-invitation resets acceptance; no mutation privilege.
        Expiry must be in the future and within 90 days.
      operationId: inviteDealViewer
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DealReadInvitationRequest'}
      responses:
        '201':
          description: Read-only invitation stored, not yet accepted
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealGrantSnapshot'}
