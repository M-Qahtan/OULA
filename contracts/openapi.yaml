openapi: 3.1.0
info:
  title: OULA Riyadh MVP API
  version: 1.3.0
  description: Secure Golden Path API for OULA.
security:
  - oulaBearer: []
paths:
  /v1/intents/{intentId}/matches:
    post:
      summary: Create and execute a match run for an active intent
      operationId: runMatching
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: MatchRun created
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRunResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/transactions/{transactionId}:
    get:
      summary: Get transaction state
      operationId: getTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Transaction state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/transactions/{transactionId}/transitions:
    post:
      summary: Advance a transaction through a legal state transition
      operationId: advanceTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionTransitionRequest'
      responses:
        '200':
          description: Transaction advanced
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true', 'false']}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intelligence/evidence:
    post:
      summary: Register evidence in the canonical Intelligence Kernel ledger
      operationId: registerIntelligenceEvidence
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceRequest'}
      responses:
        '201':
          description: Evidence registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntelligenceIdResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intelligence/assumptions:
    post:
      summary: Register a decision assumption with confidence and sensitivity
      operationId: registerIntelligenceAssumption
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssumptionRequest'}
      responses:
        '201':
          description: Assumption registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntelligenceIdResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intelligence/recommendations:
    post:
      summary: Generate an evidence-backed recommendation from a completed MatchRun
      operationId: generateIntelligenceRecommendation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationRequest'}
      responses:
        '201':
          description: Recommendation generated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intelligence/recommendations/{recommendationId}/explain:
    get:
      summary: Explain a recommendation with model, uncertainty, evidence, assumptions and alternatives
      operationId: explainIntelligenceRecommendation
      parameters:
        - in: path
          name: recommendationId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Recommendation explanation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationExplanation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/intelligence/recommendations/{recommendationId}/decisions:
    post:
      summary: Record the human decision for a recommendation
      operationId: recordIntelligenceDecision
      parameters:
        - in: path
          name: recommendationId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionRequest'}
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intelligence/decisions/{decisionId}/outcomes:
    post:
      summary: Record observed real-world outcome and expected-vs-actual variance
      operationId: recordIntelligenceOutcome
      parameters:
        - in: path
          name: decisionId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutcomeRequest'}
      responses:
        '201':
          description: Outcome recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutcomeView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intelligence/outcomes/{outcomeId}/reality-gaps:
    get:
      summary: List measured expected-vs-actual Reality Gaps for an outcome
      operationId: listOutcomeRealityGaps
      parameters:
        - in: path
          name: outcomeId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Reality Gap signals linked to the outcome
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RealityGapView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/properties/{propertyId}/state-snapshots:
    post:
      summary: Record an immutable observational property-state snapshot
      operationId: recordPropertyStateSnapshot
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PropertyStateSnapshotRequest'}
      responses:
        '201':
          description: Immutable snapshot version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PropertyStateSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}/state-snapshots/latest:
    get:
      summary: Read the latest property state that was known by a point in time
      operationId: latestKnownPropertyState
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: asOf
          required: false
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Latest known immutable snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PropertyStateSnapshot'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/intelligence/reality-gaps/{gapId}/reviews:
    post:
      summary: Record an evidence-backed human review of a Reality Gap
      operationId: reviewRealityGap
      parameters:
        - in: path
          name: gapId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RealityGapReviewRequest'}
      responses:
        '201':
          description: Reviewed Reality Gap projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealityGapView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/intelligence/outcomes/{outcomeId}/reality-case:
    get:
      summary: Reproduce the decision-to-reality lineage for an outcome
      operationId: getRealityCase
      parameters:
        - in: path
          name: outcomeId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Reality Memory composition view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealityCaseView'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/intelligence/models/{modelVersionId}/calibration:
    get:
      summary: Read workspace-scoped observational calibration signals
      operationId: getModelCalibrationProjection
      parameters:
        - in: path
          name: modelVersionId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Calibration projections; never an automatic model update
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CalibrationProjectionView'}
  /v1/properties/{propertyId}/passport:
    get:
      summary: Read the truth-aware Property Passport projection
      operationId: getPropertyPassport
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200': {description: Property Passport projection}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/properties/{propertyId}/management/enroll:
    post:
      summary: Enroll a property into the OULA management lifecycle
      operationId: enrollPropertyManagement
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Active management enrollment}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}/management:
    get:
      summary: Read obligations, Guardian signals and action items for a managed property
      operationId: getPropertyManagementOverview
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200': {description: Property management overview}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/properties/{propertyId}/obligations:
    post:
      summary: Create a canonical operational obligation
      operationId: createPropertyObligation
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obligationType, title, dueAt, priority, sourceType]
              properties:
                obligationType: {type: string, maxLength: 80}
                title: {type: string, maxLength: 255}
                dueAt: {type: string, format: date-time}
                priority: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
                sourceType: {type: string, maxLength: 80}
                sourceReference: {type: string, maxLength: 255}
      responses:
        '201': {description: Obligation created}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}/guardian/assess:
    post:
      summary: Evaluate near-term property obligations and materialize Guardian work
      operationId: assessPropertyGuardian
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Guardian assessment result}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/property-actions/{actionId}/complete:
    post:
      summary: Complete a Guardian-derived property action
      operationId: completePropertyAction
      parameters:
        - in: path
          name: actionId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolutionNote]
              properties:
                resolutionNote: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: Action completed and linked operational state resolved}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/property-actions/{actionId}/work-orders:
    post:
      summary: Create a human-authorized work order from a Guardian action
      operationId: createPropertyWorkOrder
      parameters:
        - in: path
          name: actionId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Work order pending approval}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/work-orders/{workOrderId}/approve:
    post:
      summary: Policy-gated approval of a work-order budget
      operationId: approvePropertyWorkOrder
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Jurisdiction'
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200': {description: Approved work order}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/work-orders/{workOrderId}/assign:
    post:
      summary: Policy-gated assignment of an approved work order to a provider party
      operationId: assignPropertyWorkOrder
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Jurisdiction'
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200': {description: Assigned work order}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/work-orders/{workOrderId}/start:
    post:
      summary: Policy-gated start of an assigned work order
      operationId: startPropertyWorkOrder
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Jurisdiction'
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200': {description: In-progress work order}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/work-orders/{workOrderId}/completion:
    post:
      summary: Submit cost and evidence for completion review
      operationId: submitPropertyWorkOrderCompletion
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Completion submitted for verification}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/work-orders/{workOrderId}/verify:
    post:
      summary: Verify completion and resolve the linked Guardian lifecycle
      operationId: verifyPropertyWorkOrderCompletion
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Verified completed work order}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}/work-orders:
    get:
      summary: List property work orders
      operationId: listPropertyWorkOrders
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200': {description: Work orders}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/service-providers:
    post:
      summary: Register an operational service-provider profile
      operationId: registerServiceProvider
      responses:
        '201': {description: Provider registered as UNVERIFIED}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/service-providers/{providerId}/verify:
    post:
      summary: Verify a provider profile against evidence
      operationId: verifyServiceProvider
      parameters:
        - in: path
          name: providerId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Provider verification state updated}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/service-providers/{providerId}/capabilities:
    post:
      summary: Register an active service capability
      operationId: addServiceProviderCapability
      parameters:
        - in: path
          name: providerId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Capability active}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/work-orders/{workOrderId}/quotes:
    post:
      summary: Submit a quote from a verified and qualified provider
      operationId: submitServiceQuote
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201': {description: Quote submitted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      summary: List comparable quotes for a Work Order
      operationId: listServiceQuotes
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Quotes}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/service-quotes/{quoteId}/select:
    post:
      summary: Select a quote as a human authority event
      operationId: selectServiceQuote
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Quote selected; Work Order budget and provider assigned}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/work-orders/{workOrderId}/provider-outcome:
    post:
      summary: Record observed provider outcome after verified completion
      operationId: recordProviderOutcome
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Provider outcome recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/work-orders/{workOrderId}/settlements:
    post:
      summary: Policy-gated recording of an external settlement reference without moving funds
      operationId: recordSettlementReference
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Jurisdiction'
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '201': {description: Settlement reference recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      summary: List external settlement references for a Work Order
      operationId: listSettlementReferences
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200': {description: Settlement references}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/compliance/evaluate:
    post:
      summary: Evaluate a deterministic OULA policy request
      operationId: evaluateCompliancePolicy
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyEvaluationRequest'}
      responses:
        '200':
          description: Persisted policy decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyDecision'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/compliance/policy-rules:
    post:
      summary: Create a workspace compliance rule under human property-management authority
      operationId: createCompliancePolicyRule
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Policy rule created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/compliance/approval-requests:
    post:
      summary: Request human approval when a policy decision requires it
      operationId: requestComplianceApproval
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Approval request created or replayed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/compliance/approval-requests/{approvalRequestId}/decision:
    post:
      summary: Approve or reject a pending approval request under Four-Eyes authority
      operationId: decideComplianceApproval
      parameters:
        - in: path
          name: approvalRequestId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Approval decision recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/integrations/partners:
    post:
      summary: Register external integration metadata; registration is not verification
      operationId: registerIntegrationPartner
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Unverified integration partner registered}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/integrations/partners/{partnerId}/verify:
    post:
      summary: Verify integration partner metadata using an evidence reference
      operationId: verifyIntegrationPartner
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Verified integration partner}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/integrations/partners/{partnerId}/contracts:
    post:
      summary: Create an exact purpose/operation/resource/data-class integration contract
      operationId: createIntegrationContract
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Integration contract created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/integrations/partners/{partnerId}/outbound-requests:
    post:
      summary: Prepare provider-neutral outbound metadata; no network dispatch occurs
      operationId: prepareOutboundIntegrationRequest
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Outbound request prepared}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}/vitals/assess:
    post:
      summary: Record an immutable deterministic Property Vital Signs assessment
      operationId: assessPropertyVitals
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Immutable vital snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PropertyVitalSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/properties/{propertyId}/vitals/latest:
    get:
      summary: Read the latest Property Vital Signs snapshot
      operationId: latestPropertyVitals
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Latest immutable vital snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PropertyVitalSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/properties/{propertyId}/vitals/trend:
    get:
      summary: Compare the two most recent immutable Property Vital Sign snapshots
      description: >
        Read-only observational comparison. UNKNOWN is not comparable. Different
        vital policy versions are not compared. No autonomous execution or
        causal inference is performed.
      operationId: propertyVitalTrend
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          required: false
          description: Bounded history lookup; the two newest snapshots are compared.
          schema: {type: integer, minimum: 1, maximum: 100, default: 2}
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Evidence-aware comparison or explicit non-comparability
          content:
            application/json:
              schema:
                type: object
                required: [propertyId, direction, dimensions]
                properties:
                  propertyId: {type: string, format: uuid}
                  direction:
                    type: string
                    enum: [NO_HISTORY, INSUFFICIENT_HISTORY, POLICY_NOT_COMPARABLE, NOT_COMPARABLE, UNCHANGED, IMPROVED, WORSENED, MIXED]
                  currentSnapshotId: {type: [string, 'null'], format: uuid}
                  previousSnapshotId: {type: [string, 'null'], format: uuid}
                  dimensions:
                    type: array
                    items:
                      type: object
                      required: [dimension, previous, current, direction]
                      properties:
                        dimension: {type: string}
                        previous: {type: string, enum: [UNKNOWN, GREEN, AMBER, RED]}
                        current: {type: string, enum: [UNKNOWN, GREEN, AMBER, RED]}
                        direction: {type: string, enum: [NOT_COMPARABLE, UNCHANGED, IMPROVED, WORSENED]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    oulaBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IntentId:
      in: path
      name: intentId
      required: true
      schema: {type: string, format: uuid}
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema: {type: string, format: uuid}
    WorkspaceId:
      in: header
      name: X-OULA-Workspace-ID
      required: true
      description: Requested workspace; must also be authorized by the JWT.
      schema: {type: string, format: uuid}
    Purpose:
      in: header
      name: X-OULA-Purpose
      required: true
      description: Purpose limitation; must match both operation policy and JWT claims.
      schema:
        type: string
        enum: [PROPERTY_DECISION_SUPPORT, TRANSACTION_EXECUTION, PROPERTY_MANAGEMENT, AUTONOMOUS_EXECUTION, INTEGRATION_OPERATIONS]
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    Jurisdiction:
      in: header
      name: X-OULA-Jurisdiction
      required: false
      description: Explicit policy jurisdiction. Omission is represented as UNSPECIFIED; OULA does not infer jurisdiction.
      schema: {type: string, minLength: 1, maxLength: 80, default: UNSPECIFIED}
    ApprovalId:
      in: header
      name: X-OULA-Approval-ID
      required: false
      description: Context-bound approved compliance request used only when the active policy requires approval.
      schema: {type: string, format: uuid}
  schemas:
    MatchRunResponse:
      type: object
      required: [matchRunId, matches]
      properties:
        matchRunId: {type: string, format: uuid}
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchItem'
    MatchItem:
      type: object
      required: [propertyId, rank, score, confidence, dimensions]
      properties:
        propertyId: {type: string, format: uuid}
        rank: {type: integer, minimum: 1}
        score: {type: number, minimum: 0, maximum: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        dimensions:
          type: object
          additionalProperties: {type: number}
    TransactionTransitionRequest:
      type: object
      required: [expectedVersion, target, reason]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        target:
          type: string
          enum: [DRAFT, QUALIFIED, VIEWING, OFFERING, NEGOTIATING, DUE_DILIGENCE, CONTRACTING, CLOSING, HANDOVER, COMPLETED, CANCELLED]
        reason: {type: string, minLength: 1, maxLength: 500}
    TransactionResponse:
      type: object
      required: [id, workspaceId, stage, version]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        stage: {type: string}
        version: {type: integer, minimum: 0}
    IntelligenceIdResponse:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    EvidenceRequest:
      type: object
      required: [evidenceType, sourceType, contentHash, verificationStatus]
      properties:
        evidenceType:
          type: string
          enum: [DOCUMENT, PHOTO, VIDEO, SENSOR_READING, GOVERNMENT_RECORD, SIGNED_ASSERTION, CALCULATION, INSPECTION, TRANSACTION_RECORD, USER_REPORTED_OUTCOME]
        sourceType: {type: string, maxLength: 80}
        sourceIdentity: {type: string, maxLength: 255}
        contentReference: {type: string}
        contentHash: {type: string, minLength: 1, maxLength: 128}
        verificationStatus:
          type: string
          enum: [UNVERIFIED, VERIFIED, REJECTED, EXPIRED]
        capturedAt: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
        jurisdiction: {type: string, maxLength: 80}
    AssumptionRequest:
      type: object
      required: [statement, value, source, reason, confidence, sensitivity]
      properties:
        statement: {type: string, minLength: 1}
        value: {type: object, additionalProperties: true}
        source: {type: string, minLength: 1, maxLength: 255}
        reason: {type: string, minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        sensitivity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        validUntil: {type: string, format: date-time}
    RecommendationRequest:
      type: object
      required: [matchRunId, evidenceIds, validHours]
      properties:
        matchRunId: {type: string, format: uuid}
        evidenceIds:
          type: array
          maxItems: 25
          items: {type: string, format: uuid}
        assumptionIds:
          type: array
          maxItems: 25
          items: {type: string, format: uuid}
        validHours: {type: integer, minimum: 1, maximum: 720}
    RecommendationView:
      type: object
      required: [recommendationId, matchRunId, recommendedPropertyId, lifeFitScore, confidence, modelId, modelVersion, evidenceIds, assumptionIds]
      properties:
        recommendationId: {type: string, format: uuid}
        matchRunId: {type: string, format: uuid}
        recommendedPropertyId: {type: string, format: uuid}
        lifeFitScore: {type: number, minimum: 0, maximum: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        modelId: {type: string}
        modelVersion: {type: string}
        evidenceIds: {type: array, items: {type: string, format: uuid}}
        assumptionIds: {type: array, items: {type: string, format: uuid}}
    RecommendationExplanation:
      type: object
      required: [recommendationId, executiveSummary, recommendedPropertyId, lifeFitScore, confidence, confidenceBreakdown, uncertainty, modelId, modelVersion, modelType, riskClass, evidenceIds, assumptionIds, alternatives]
      properties:
        recommendationId: {type: string, format: uuid}
        executiveSummary: {type: string}
        recommendedPropertyId: {type: string, format: uuid}
        lifeFitScore: {type: number}
        confidence: {type: number}
        confidenceBreakdown: {type: object, additionalProperties: true}
        uncertainty: {type: object, additionalProperties: true}
        modelId: {type: string}
        modelVersion: {type: string}
        modelType: {type: string}
        riskClass: {type: string}
        evidenceIds: {type: array, items: {type: string, format: uuid}}
        assumptionIds: {type: array, items: {type: string, format: uuid}}
        alternatives:
          type: array
          items:
            type: object
            properties:
              propertyId: {type: string, format: uuid}
              rank: {type: integer}
              lifeFitScore: {type: number}
              confidence: {type: number}
              dimensions: {type: object, additionalProperties: true}
              expectedCommuteMinutes: {type: integer, minimum: 0}
    DecisionRequest:
      type: object
      required: [selectedPropertyId]
      properties:
        selectedPropertyId: {type: string, format: uuid}
        overrideReason: {type: string}
    DecisionView:
      type: object
      required: [decisionId, recommendationId, selectedPropertyId, acceptedRecommendation]
      properties:
        decisionId: {type: string, format: uuid}
        recommendationId: {type: string, format: uuid}
        selectedPropertyId: {type: string, format: uuid}
        acceptedRecommendation: {type: boolean}
    OutcomeRequest:
      type: object
      required: [actualCommuteMinutes, satisfactionScore, confidence, evidenceIds]
      properties:
        actualCommuteMinutes: {type: integer, minimum: 0}
        satisfactionScore: {type: number, minimum: 0, maximum: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidenceIds:
          type: array
          maxItems: 25
          items: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
    OutcomeView:
      type: object
      required: [outcomeId, decisionId, observationId, expectedMetrics, actualMetrics, varianceMetrics]
      properties:
        outcomeId: {type: string, format: uuid}
        decisionId: {type: string, format: uuid}
        observationId: {type: string, format: uuid}
        expectedMetrics: {type: object, additionalProperties: true}
        actualMetrics: {type: object, additionalProperties: true}
        varianceMetrics: {type: object, additionalProperties: true}
    RealityGapView:
      type: object
      required: [gapId, outcomeId, decisionId, recommendationId, modelVersionId, metricKey, expectedValue, actualValue, signedError, absoluteError, policyKey, policyVersion, classification, causeCategory, reviewStatus, calibrationStatus, detectedAt]
      properties:
        gapId: {type: string, format: uuid}
        outcomeId: {type: string, format: uuid}
        decisionId: {type: string, format: uuid}
        recommendationId: {type: string, format: uuid}
        modelVersionId: {type: string, format: uuid}
        metricKey: {type: string}
        unit: {type: string}
        expectedValue: {type: number}
        actualValue: {type: number}
        signedError:
          type: number
          description: Scientific convention: expected minus actual.
        absoluteError: {type: number, minimum: 0}
        relativeError:
          type: [number, 'null']
          minimum: 0
        policyKey: {type: string}
        policyVersion: {type: string}
        classification:
          type: string
          enum: [WITHIN_EXPECTATION, MINOR_VARIANCE, MATERIAL_VARIANCE, SEVERE_VARIANCE, UNKNOWN]
        causeCategory:
          type: string
          enum: [DATA_ERROR, MISSING_VARIABLE, MODEL_ERROR, BEHAVIORAL_SHIFT, MARKET_SHOCK, REGULATORY_CHANGE, SPATIAL_CHANGE, EXECUTION_FAILURE, MEASUREMENT_ERROR, UNKNOWN_CAUSE]
        reviewStatus:
          type: string
          enum: [PENDING_REVIEW, REVIEWED, DISMISSED]
        calibrationStatus:
          type: string
          enum: [UNASSESSED, CANDIDATE, EXCLUDED, CONSUMED]
        detectedAt: {type: string, format: date-time}
    PropertyStateSnapshotRequest:
      type: object
      required: [stateBasis, state, sourceType]
      properties:
        effectiveAt: {type: string, format: date-time}
        stateBasis:
          type: string
          enum: [OBSERVATIONS, UNKNOWN]
          description: External API cannot assert CANONICAL_FACTS or MIXED truth.
        state: {type: object, additionalProperties: true}
        sourceType: {type: string, maxLength: 80}
        sourceReference: {type: string, maxLength: 255}
        evidenceRefs:
          type: array
          maxItems: 25
          items: {type: string, format: uuid}
    PropertyStateSnapshot:
      type: object
      required: [snapshotId, workspaceId, propertyId, version, effectiveAt, recordedAt, stateBasis, state, sourceType]
      properties:
        snapshotId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        effectiveAt: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
        stateBasis: {type: string}
        state: {type: object, additionalProperties: true}
        sourceType: {type: string}
        sourceReference: {type: [string, 'null']}
        supersedesSnapshotId: {type: [string, 'null'], format: uuid}
    RealityGapReviewRequest:
      type: object
      required: [causeCategory, rationale, reviewStatus, calibrationStatus]
      properties:
        causeCategory:
          type: string
          enum: [DATA_ERROR, MISSING_VARIABLE, MODEL_ERROR, BEHAVIORAL_SHIFT, MARKET_SHOCK, REGULATORY_CHANGE, SPATIAL_CHANGE, EXECUTION_FAILURE, MEASUREMENT_ERROR, UNKNOWN_CAUSE]
        causeConfidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        rationale: {type: string}
        reviewStatus:
          type: string
          enum: [REVIEWED, DISMISSED]
        calibrationStatus:
          type: string
          enum: [CANDIDATE, EXCLUDED]
        evidenceIds:
          type: array
          maxItems: 25
          items: {type: string, format: uuid}
    RealityCaseView:
      type: object
      required: [outcomeId, decisionId, recommendationId, propertyId, modelVersionId, recommendationGeneratedAt, decidedAt, observedAt, realityGapCount, pendingReviewCount]
      properties:
        outcomeId: {type: string, format: uuid}
        decisionId: {type: string, format: uuid}
        recommendationId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        propertySnapshotId: {type: [string, 'null'], format: uuid}
        modelVersionId: {type: string, format: uuid}
        recommendationGeneratedAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
        observedAt: {type: string, format: date-time}
        realityGapCount: {type: integer, minimum: 0}
        pendingReviewCount: {type: integer, minimum: 0}
        maxAbsoluteError: {type: [number, 'null']}
        maxRelativeError: {type: [number, 'null']}
    CalibrationProjectionView:
      type: object
      required: [modelVersionId, metricKey, policyKey, policyVersion, sampleCount, materialVarianceCount, severeVarianceCount, reviewedCount, calibrationCandidateCount, unknownCauseCount, lastDetectedAt]
      properties:
        modelVersionId: {type: string, format: uuid}
        metricKey: {type: string}
        policyKey: {type: string}
        policyVersion: {type: string}
        sampleCount: {type: integer, minimum: 0}
        averageAbsoluteError: {type: [number, 'null']}
        averageRelativeError: {type: [number, 'null']}
        materialVarianceCount: {type: integer, minimum: 0}
        severeVarianceCount: {type: integer, minimum: 0}
        reviewedCount: {type: integer, minimum: 0}
        calibrationCandidateCount: {type: integer, minimum: 0}
        unknownCauseCount: {type: integer, minimum: 0}
        lastDetectedAt: {type: string, format: date-time}
    PolicyEvaluationRequest:
      type: object
      required: [action, resourceType, resourceId, jurisdiction]
      properties:
        action: {type: string, maxLength: 120}
        resourceType: {type: string, maxLength: 80}
        resourceId: {type: string, format: uuid}
        jurisdiction: {type: string, maxLength: 80}
        amount: {type: [number, 'null'], minimum: 0}
        currency: {type: [string, 'null'], minLength: 3, maxLength: 3}
        verificationPresent: {type: boolean, default: false}
        evidencePresent: {type: boolean, default: false}
        approvalRequestId: {type: [string, 'null'], format: uuid}
        context: {type: object, additionalProperties: true}
    PolicyDecision:
      type: object
      required: [id, workspaceId, actorId, purpose, action, resourceType, resourceId, jurisdiction, decision, reasonCodes, evaluatedAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        purpose: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string, format: uuid}
        jurisdiction: {type: string}
        amount: {type: [number, 'null']}
        currency: {type: [string, 'null']}
        policyRuleId: {type: [string, 'null'], format: uuid}
        approvalRequestId: {type: [string, 'null'], format: uuid}
        decision:
          type: string
          enum: [ALLOW, DENY, REQUIRE_APPROVAL, REQUIRE_DOCUMENT, REQUIRE_VERIFICATION, ESCALATE]
        reasonCodes: {type: array, items: {type: string}}
        evaluatedAt: {type: string, format: date-time}
    PropertyVitalSnapshot:
      type: object
      required: [id, workspaceId, propertyId, policyKey, policyVersion, overallStatus, knownDimensionCount, assessedAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        policyKey: {type: string}
        policyVersion: {type: string}
        overallStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        obligationStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        guardianStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        executionStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        costStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        providerStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        evidenceStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        truthStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        freshnessStatus: {type: string, enum: [GREEN, AMBER, RED, UNKNOWN]}
        knownDimensionCount: {type: integer, minimum: 0, maximum: 8}
        openObligations: {type: integer, minimum: 0}
        overdueObligations: {type: integer, minimum: 0}
        openGuardianSignals: {type: integer, minimum: 0}
        criticalGuardianSignals: {type: integer, minimum: 0}
        openWorkOrders: {type: integer, minimum: 0}
        overdueWorkOrders: {type: integer, minimum: 0}
        completedWorkOrders: {type: integer, minimum: 0}
        averageBudgetUtilization: {type: [number, 'null']}
        averageProviderRating: {type: [number, 'null']}
        averageProviderCostVarianceRatio: {type: [number, 'null']}
        verifiedFactCoverage: {type: [number, 'null']}
        latestOperationalActivityAt: {type: [string, 'null'], format: date-time}
        latestPropertyFactAt: {type: [string, 'null'], format: date-time}
        assessedBy: {type: string, format: uuid}
        assessedAt: {type: string, format: date-time}
    Problem:
      type: object
      properties:
