spring:
  application:
    name: oula-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oula}
    username: ${DB_USER:oula}
    password: ${DB_PASSWORD:oula}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
