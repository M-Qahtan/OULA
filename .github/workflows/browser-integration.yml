name: OULA Browser Integration

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "contracts/openapi.yaml"
      - ".github/workflows/browser-integration.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "contracts/openapi.yaml"
      - ".github/workflows/browser-integration.yml"

permissions:
  contents: read

concurrency:
  group: browser-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: oula
          POSTGRES_USER: oula
          POSTGRES_PASSWORD: oula
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U oula -d oula"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/oula
      DB_USER: oula
      DB_PASSWORD: oula
      SPRING_PROFILES_ACTIVE: dev-auth
      OULA_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      OUTBOX_DISPATCH_ENABLED: "false"
      NEXT_PUBLIC_OULA_DEV_AUTH: "true"
      NEXT_PUBLIC_OULA_API_BASE_URL: http://127.0.0.1:8080
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -ntp -DskipTests package

      - name: Start backend with dev-auth profile
        run: |
          nohup java -jar target/oula-*.jar > /tmp/oula-backend.log 2>&1 &
          echo $! > /tmp/oula-backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/oula-backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build frontend in explicit DEV_AUTH mode
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Browser -> signed JWT -> Java -> PostgreSQL
        working-directory: apps/web
        run: npm run test:integration

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/oula-backend.log
